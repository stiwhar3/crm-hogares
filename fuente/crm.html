<title>CRM Hogares Fuenlabrada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra de pestañas fija arriba, una columna de listas operativas; "Hoy" primero porque el CRM existe para que nada se quede sin próximo paso. */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --fg:#17211f; --muted:#5d6b68; --line:#dfe5e3;
  --accent:#0d6b62; --accent-soft:#e1f0ed; --on-accent:#ffffff;
  --ok:#2f7d3a; --ok-soft:#e5f3e6; --warn:#a86200; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101615; --surface:#18201f; --fg:#e4ecea; --muted:#9aaba7; --line:#2a3533;
  --accent:#4fc2b4; --accent-soft:#173532; --on-accent:#08201d;
  --ok:#7fcf88; --ok-soft:#1c3320; --warn:#f0b65a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#18201f; --fg:#e4ecea; --muted:#9aaba7; --line:#2a3533;
  --accent:#4fc2b4; --accent-soft:#173532; --on-accent:#08201d;
  --ok:#7fcf88; --ok-soft:#1c3320; --warn:#f0b65a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:6px 8px}
nav button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{padding-block:20px 60px;display:grid;gap:24px}
h2{font-family:var(--display);font-size:17px;margin:0 0 10px;text-wrap:balance}
h2 .n{color:var(--muted);font-family:var(--body);font-weight:500;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .m{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--line);color:var(--fg);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.zone{display:inline-flex;align-items:center;gap:5px}
.zone::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--z,#999);border:1px solid rgba(0,0,0,.15)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools input,.tools select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
.tools input[type=search]{flex:1 1 200px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
#view section{min-width:0;max-width:100%}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,20,18,.45);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none!important}
.modal form{display:flex;flex-direction:column;width:min(640px,100%);max-height:100%;background:var(--surface);color:var(--fg);border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dh{padding:16px 18px 8px;font-family:var(--display);font-size:18px;font-weight:700}
.db{padding:8px 18px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.db label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.db label.full{grid-column:1/-1}
.db label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.db input,.db select,.db textarea{font:inherit;font-size:15px;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.db textarea{min-height:90px;resize:vertical}
.db label.check input{width:auto}
.df{display:flex;justify-content:space-between;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .right{display:flex;gap:8px;margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);padding:6px 12px;border-radius:16px;cursor:pointer}
.chip span{color:var(--muted);font-weight:500;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] span{color:var(--on-accent)}
details.desp>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;list-style:none}
details.desp>summary::-webkit-details-marker{display:none}
details.desp>summary h2{margin:0}
details.desp>summary .flecha{color:var(--muted);font-size:18px;transition:transform .15s}
details.desp[open]>summary .flecha{transform:rotate(180deg)}
details.desp[open]>summary{margin-bottom:8px}
table.pg td{vertical-align:top}table.pg input:not([type=checkbox]),table.pg select{width:100%;min-width:90px;font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:6px}
tr.pg-ko td{background:#fbeaea}tr.pg-igual{opacity:.55}.pg-m{font-size:12px;color:var(--muted);margin-top:2px}
details.bld{border-top:1px solid var(--line)} details.bld:first-child{border-top:0}
details.bld summary{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;padding:11px 14px;cursor:pointer;list-style:none}
details.bld summary::-webkit-details-marker{display:none}
details.bld summary .t{font-weight:600} details.bld summary .m{font-size:13px;color:var(--muted)}
details.bld[open] summary{background:var(--accent-soft)}
details.bld .nb{border:0;border-top:1px solid var(--line);border-radius:0}
details.bld .tbl-wrap{border:0;border-radius:0;border-top:1px solid var(--line)}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;font-size:13px;color:var(--muted)}.pager label{display:flex;gap:6px;align-items:center}.pager select{width:auto;padding:4px 8px}
.vivbox{border:1px solid var(--line);padding:10px 12px;display:grid;gap:6px;background:var(--card,transparent)}.vivbox .vb-h{font-weight:600;display:flex;gap:8px;align-items:center}.vivbox .vb-t{font-weight:600}.vivbox .vb-s{font-size:13px;color:var(--muted)}.vivbox .vb-c{font-size:13px;white-space:pre-wrap;max-height:90px;overflow:auto;color:var(--muted)}.vivbox .vb-b{display:flex;gap:8px;flex-wrap:wrap}.vb-res{display:grid;gap:4px;max-height:240px;overflow:auto}.vb-o{all:unset;cursor:pointer;padding:7px 9px;border:1px solid var(--line);font-size:14px}.vb-o:hover,.vb-o:focus{border-color:var(--accent)}.vb-o span{color:var(--muted);font-size:12px}
.portal{display:grid;gap:6px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}.portal .pi{display:flex;flex-wrap:wrap;gap:4px}.portal .po{color:var(--muted)}.portal .btn{justify-self:start}
.pbar{display:flex;height:6px;background:var(--line);overflow:hidden;max-width:320px}.pbar i{display:block;height:100%}
.kos{display:grid;gap:8px;padding:10px 14px}
.ko{font-size:14px} .ko .s{font-size:13px;color:var(--muted);margin-top:2px}
tr.viv{cursor:pointer} tr.viv:hover td{background:var(--accent-soft)} tr.viv.ed td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.hist{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.hist .hl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.he{font-size:14px;line-height:1.4;border-left:2px solid var(--line);padding-left:10px}
.he .hf{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.he .hn{white-space:pre-wrap} .he .hc{font-size:13px;color:var(--muted)} .he s{opacity:.75}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <h1>Hogares Fuenlabrada <small>CRM</small></h1>
      <button class="btn primary small" id="btn-new" type="button">+ Nuevo</button>
    </div>
    <nav id="tabs" aria-label="Secciones">
      <button data-v="hoy" type="button">Hoy</button>
      <button data-v="resultados" type="button">Resultados</button>
      <button data-v="contactos" type="button">Noticias</button>
      <button data-v="captaciones" type="button">Captaciones</button>
      <button data-v="encargos" type="button">Encargos</button>
      <button data-v="operaciones" type="button">Operaciones</button>
      <button data-v="censo" type="button">Censo</button>
      <button data-v="localizar" type="button">Localizar</button>
      <button data-v="equipo" type="button">Equipo</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="dlg" class="modal" role="dialog" aria-modal="true" hidden><form id="frm" novalidate></form></div>
<div class="toast" id="toast" hidden></div>

<script>
/* Ventana propia en vez de <dialog>: en algunas vistas de la app showModal() no abre nada. */
(function(){const d=document.getElementById("dlg");d.open=false;
  d.showModal=function(){d.hidden=false;d.open=true;document.body.style.overflow="hidden";setTimeout(()=>{const f=d.querySelector("input,select,textarea");if(f&&window.innerWidth>700)f.focus()},30)};
  d.close=function(){if(!d.open)return;d.hidden=true;d.open=false;document.body.style.overflow="";d.dispatchEvent(new Event("close"))};
  d.addEventListener("click",e=>{if(e.target===d)d.close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&d.open)d.close()});})();
const ZONAS = {VERDE:"#3a9a4a",AZUL:"#2f6fd0",AMARILLA:"#e3b300",ROJA:"#cf3b30",ROSA:"#e57ab0",NARANJA:"#ee8a2a",MORADA:"#7d4fc4",MARRON:"#8a5a35",BLANCA:"#f2f2f2"};
const ETAPAS = ["Desarrollo","Seguimiento","Paralizado","Valoración agendada","Valorada","Encargo","KO"];
const ETAPA_ANTIGUA = {"Noticia":"Desarrollo","En seguimiento":"Seguimiento"};
const ORIGENES = ["Lead central (con contacto)","Consulta de valor (solo dirección)","Otra oficina Hogares","Puerta fría / buzoneo","Llamada a oficina","Particular que vende solo","Con otra agencia","Base de datos antigua","Recomendación","Otro"];
const MOTIVOS = ["","Herencia","Divorcio","Extinción de condominio","Cambio de vivienda","Inversor","Vacío","Alquilado","Otro"];
const EST_ENC = ["Activo","Reservado","Vendido","Retirado","Devuelto"];
const EST_OP = ["Reserva","Aceptada","Arras","Escriturada","Caída"];
const DEF_AJUSTES = {asesores:[{nombre:"Carlos",zona:"ROSA"},{nombre:"Iván",zona:"AZUL"},{nombre:"Sergio",zona:"AMARILLA"},{nombre:"Mery",zona:"VERDE"},{nombre:"Mario",zona:""}],
  objetivoMes:40000,objetivoPeriodo:200000,periodoInicio:"2026-10-01",periodoFin:"2026-12-31",gastosMes:24000,diasRevisionPrecio:30};

const S = {view:"hoy",contactos:[],encargos:[],operaciones:[],captaciones:[],ajustes:DEF_AJUSTES,db:null,censo:null,censoEd:{},portales:{},f:{q:"",asesor:"",etapa:"activos",paso:"",estado:"Activo"},cf:{zona:"",q:"",ko:false},kf:{zona:"",asesor:"",estado:"Pendiente",q:""},pag:{},hoyMas:{},lf:{zona:"",calle:"",num:"",m2:"",dm2:"5",anio:"",danio:"3",tipo:"",planta:"",rc:""}};
const $ = s=>document.querySelector(s);
const esc = v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n=>(Number(n)||0).toLocaleString("es-ES",{maximumFractionDigits:0})+" €";
const hoyISO = ()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dias = (a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fmtF = s=>s?new Date(s+"T12:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short"}):"";
const zona = z=>z?`<span class="zone" style="--z:${ZONAS[z]||"#999"}">${esc(z.charAt(0)+z.slice(1).toLowerCase())}</span>`:"";
const personas = ()=>[...S.ajustes.asesores.map(a=>a.nombre),"Stiwhar","OFICINA"];
/* ---------- Mapa del censo y ruta de puerta fría ---------- */
function cargarLeaflet(){return cargarLeaflet.p||(cargarLeaflet.p=new Promise((ok,ko)=>{const l=document.createElement("link");l.rel="stylesheet";l.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(l);
  const sc=document.createElement("script");sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)}))}
function portalesMapa(zona){const Z=(S.censo||{})[zona],G=S.geo||{},hoy=Date.now(),out=[];if(!Z)return out;
  for(const b of Z.edificios){const pc=(b.u.find(u=>u.rc&&u.rc.length>=14)||{}).rc;const g=pc&&G[pc.slice(0,14)];if(!g)continue;
    const U=b.u.map(u=>({...u,...(S.censoEd[u._id]||{})}));let ult=null;
    for(const u of U){const f=fechaTxt(u.ult);if(f&&(!ult||f>ult))ult=f;const e=S.censoEd[u._id];if(e&&e.actualizado){const d=new Date(e.actualizado);if(!ult||d>ult)ult=d}}
    const not=b.u.some(u=>notiDe(u._id)),ko=b.ko&&b.ko.length,dd=ult?Math.round((hoy-ult)/864e5):null,tel=U.filter(u=>/\d{9}/.test(String(u.tel||"").replace(/\s/g,""))).length;
    const est=not?"noticia":ko?"ko":dd!=null&&dd<=90?"tocado":"sin";
    out.push({pid:portalId(b),b,lat:g[0],lon:g[1],est,dd,tel,n:b.u.length})}
  return out}
const COL_MAPA={noticia:"#ac9465",ko:"#b3261e",tocado:"#2f7d3a",sin:"#8a8784"};
function rutaHoy(P,n){const L=P.filter(p=>p.est==="sin").sort((a,b)=>b.n-a.n);if(!L.length)return [];const r=[L.shift()];
  while(r.length<n&&L.length){const c=r[r.length-1];let bi=0,bd=1e9;L.forEach((p,i)=>{const d=(p.lat-c.lat)**2+((p.lon-c.lon)*0.76)**2;if(d<bd){bd=d;bi=i}});r.push(L.splice(bi,1)[0])}return r}
const ll=p=>p.lat.toFixed(6)+","+p.lon.toFixed(6);
function vMapa(zona){const P=portalesMapa(zona),cnt=k=>P.filter(p=>p.est===k).length,R=rutaHoy(P,10);S.ruta=R;
  if(!S.geo)return `<div class="empty">Cargando las coordenadas de los portales…</div>`;
  const url=R.length>1?"https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+ll(R[0])+"&destination="+ll(R[R.length-1])+(R.length>2?"&waypoints="+R.slice(1,-1).map(ll).join("|"):""):"";
  return `<section><div class="tools" style="font-size:13px;gap:14px">${[["sin","Sin tocar en 90 días"],["tocado","Contactado en 90 días"],["noticia","Con noticia"],["ko","Con KO"]].map(([k,t])=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${COL_MAPA[k]}"></span> ${t} (${cnt(k)})</span>`).join("")}</div>
  <div id="mapa" style="height:480px;border:1px solid var(--line);margin-top:8px"></div>
  <p style="margin:6px 0 0;color:var(--muted);font-size:12px">${P.length} portales con coordenadas del catastro. Toca un portal para ver sus datos.</p></section>
  <section><h2>Ruta de puerta fría de hoy <span class="n">${R.length}</span></h2><p style="margin:0 0 8px;color:var(--muted);font-size:13px">Portales sin tocar en 90 días, empezando por el más grande y siguiendo por el más cercano.</p>
  ${R.length?`<div class="list">${R.map((p,i)=>`<button class="row" type="button" data-cq="${esc(p.b.via+" "+p.b.num)}"><span class="t">${i+1}. ${esc(titulo(viaLarga(p.b.via)))} ${esc(p.b.num)}</span><span class="r">${p.n} viv.</span><span class="m"><span>${p.tel} con teléfono</span><span>${p.dd==null?"Nunca contactado":"Último contacto hace "+p.dd+" días"}</span></span></button>`).join("")}</div>
  ${url?`<div class="tools" style="margin-top:8px"><a class="btn primary small" href="${url}" target="_blank" rel="noopener">Abrir la ruta en Google Maps (a pie)</a></div>`:""}`:`<div class="empty">Todos los portales con coordenadas se han tocado en los últimos 90 días.</div>`}</section>`}
async function pintarMapa(zona){try{await cargarLeaflet()}catch(e){$("#mapa").innerHTML=`<div class="empty">No se ha podido cargar el mapa.</div>`;return}
  const el=$("#mapa");if(!el||el._hecho)return;el._hecho=1;const P=portalesMapa(zona);if(!P.length)return;
  const m=L.map(el);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function rangoPer(per){const h=new Date();h.setHours(0,0,0,0);let a,b;
  if(per==="semana"){a=new Date(h);a.setDate(h.getDate()-((h.getDay()+6)%7));b=new Date(a);b.setDate(a.getDate()+6)}

  else{a=new Date(h.getFullYear(),h.getMonth(),1);b=new Date(h.getFullYear(),h.getMonth()+1,0)}

/* ---------- «A quién llamar hoy»: probabilidad de vender ---------- */
function fechaTxt(t){let best=null;for(const m of String(t||"").matchAll(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/g)){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);if(!isNaN(d)&&d<=new Date()&&(!best||d>best))best=d}return best}
function puntuarViv(u){let p=0;const M=[],ocu=String(u.ocu||"").toUpperCase(),com=String(u.com||"");
  if(/VAC/.test(ocu)){p+=30;M.push("Vacía")}else if(/INQUIL|ALQ/.test(ocu)){p+=25;M.push("Alquilada (inversor)")}else if(/FAMILIAR/.test(ocu)){p+=10;M.push("Vive un familiar")}
  if(u.val){p+=25;M.push("Ya se valoró")}
  const em=[...com.matchAll(/\((19\d{2})\)/g)].map(m=>+m[1]);
  if(em.length){const y=Math.min(...em);if(y<=1950){p+=20;M.push("Mayores de 75")}else if(y<=1958){p+=10;M.push("Mayores de 67")}}
  const f=fechaTxt(u.ult)||fechaTxt(com),dd=f?Math.round((Date.now()-f)/864e5):null;
  if(dd==null){p+=15;M.push("Nunca contactada")}else if(dd>180){p+=10;M.push("Sin contacto hace "+Math.round(dd/30)+" meses")}else if(dd<30){p-=40;M.push("Contactada hace "+dd+" días")}
  if(+u.anio&&+u.anio<1975){p+=5}
  if(/no (quiere|vende|va a vender)|no le (vuelva|llame)|\bko\b|borr(e|ar) su/i.test(com)){p-=50;M.push("Dijo que no")}
  return {p,M}}

  return out.sort((a,b)=>b.p-a.p)}

    const pl=/^b/i.test(m[2])?"0":/^[áa]t/i.test(m[2])?"AT":String(+m[2]);let rest=m[4]||"",tel="",nombre="",com="";
    const t=rest.match(/(?:\+?34[\s.]?)?([6789](?:[\s.]?\d){8})(?!\d)/);
    let antes=rest,despues="";if(t){tel=t[1].replace(/\D/g,"");antes=rest.slice(0,t.index);despues=rest.slice(t.index+t[0].length)}

function urgPub(c){
  if(!c.publicado||c.etapa!=="Desarrollo") return null;
  const lim=c.publicado==="Particular"?1:2,d0=new Date((c.fechaPublicado||hoyISO())+"T12:00");d0.setDate(d0.getDate()+lim);
  const lv=d0.toISOString().slice(0,10),d=dias(hoyISO(),lv);
  return {limite:lv,d,cls:d<=0?"bad":"warn",txt:d<0?`Publicada sin localizar: venció hace ${-d} d`:d===0?"Publicada: localizar HOY":`Publicada: localizar antes del ${fmtF(lv)}`};
}
const urgentes=()=>S.contactos.filter(urgPub).sort((a,b)=>urgPub(a).limite.localeCompare(urgPub(b).limite));
function proxEstado(c){
  if(c.etapa==="KO"||c.etapa==="Encargo") return null;
  if(!c.proxFecha) return {cls:"bad",txt:"Sin próximo paso"};
  const d=dias(hoyISO(),c.proxFecha);
  if(d<0) return {cls:"bad",txt:`Vencido hace ${-d} d`};
  if(d===0) return {cls:"warn",txt:"Hoy"};
  return {cls:"",txt:fmtF(c.proxFecha)};
}
function alertaEncargo(e){
  const out=[]; if(e.estado!=="Activo") return out;
  const base=[e.fechaCaptacion,e.ultimaRevisionPrecio].filter(Boolean).sort().pop();
  if(base){const d=dias(base,hoyISO()); if(d>=S.ajustes.diasRevisionPrecio) out.push({cls:"bad",txt:`Revisar precio (${d} d)`});}
  if(e.exclusiva==="Sí"&&e.finExclusiva){const d=dias(hoyISO(),e.finExclusiva); if(d<0) out.push({cls:"warn",txt:"Exclusiva vencida: confirmar renovación"}); else if(d<=10) out.push({cls:"warn",txt:`Exclusiva vence en ${d} d`});}
  if(e.exclusiva!=="Sí") out.push({cls:"warn",txt:"Sin exclusiva"});
  return out;
}
const enRango=(f,a,b)=>f&&f>=a&&f<=b;
const facturada=o=>o.fechaAceptacion&&o.estado!=="Caída";
function sumFact(a,b,quien){return S.operaciones.filter(o=>facturada(o)&&enRango(o.fechaAceptacion,a,b)&&(!quien||o.asesor===quien)).reduce((s,o)=>s+(+o.honorarios||0),0)}
function sumCobr(a,b){return S.operaciones.filter(o=>o.estado!=="Caída"&&enRango(o.fechaCobro,a,b)).reduce((s,o)=>s+(+o.honorarios||0),0)}

const contactosPendientes=()=>S.contactos.filter(c=>{const p=proxEstado(c);return p&&c.proxFecha&&(p.cls==="bad"||p.cls==="warn")});
const sinPaso=()=>S.contactos.filter(c=>{const p=proxEstado(c);return p&&!c.proxFecha});

const ZTIPOS=/^\s*(C\/|(?:CL|CALLE|AV|AVD|AVDA|AVENIDA|PZA|PZ|PL|PLAZA|PASEO|PS|PSO|CAMINO|CM|CTRA|CARRETERA|TRAVESIA|TR|GLORIETA|GTA|RONDA|RD|URB|URBANIZACION)(?:\.|\s|\/)+)/;

function zonaDe(dir){

  const e=rest.match(/\b(?:ESC(?:ALERA)?|PORTAL|P|BLOQ(?:UE)?|BLQ|E)\.?\s*:?\s*(\d+|IZQ\w*|DCH\w*|DER\w*)\b/);
  if(e){o.esc=/^IZQ/.test(e[1])?"I":/^(DCH|DER)/.test(e[1])?"D":String(+e[1]);rest=rest.slice(0,e.index)+" "+rest.slice(e.index+e[0].length)}

const zPP=t=>String(t??"").toUpperCase().trim().replace(/^0+(?=[0-9A-Z])/,"");

  $("#frm").innerHTML=`<div class="dh">${esc(r.b.via)} ${esc(r.b.num)}<div style="font:500 13px var(--body);color:var(--muted)">Zona ${esc(r.zona.toLowerCase())} · ${r.b.u.length} viviendas · ${R.txt}</div></div>
    <div class="db">${FORMS.portales.fields.map(f=>field(f,d[f[0]])).join("")}${bloqueHist(d,true)}</div>
    <div class="df"><div class="right"><button class="btn" type="button" data-act="cerrar">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></div>`;
  $("#dlg").showModal()}
FORMS.censoEdits={titulo:"vivienda",fields:[["prop","Propietario","text",{full:1}],["abre","Quién abre","text"],["tel","Teléfono","tel"],["ocu","Ocupado por","sel",()=>OCUPA],
  ["loc","Propietario localizado","sel",()=>["","SI","NO"]],["ult","Último contacto","text"],["tipo","Tipo de contacto","text"],["val","Valorada (fecha y precio)","text"],["com","Comentarios","textarea",{full:1}]]};
function abrirViv(id){
  const r=buscarViv(id); if(!r) return; const d={...r.u,...(S.censoEd[id]||{})}; cur={col:"censoEdits",id,viv:r};
  const dir=[r.b.via,r.b.num,r.u.esc&&("Esc "+r.u.esc),r.u.planta&&(r.u.planta+"º"),r.u.puerta].filter(Boolean).join(" ");
  $("#frm").innerHTML=`<div class="dh">${esc(dir)}<div style="font:500 13px var(--body);color:var(--muted)">Zona ${esc(r.zona.toLowerCase())}${r.u.m2?" · "+esc(r.u.m2)+" m²":""}${r.u.anio?" · "+esc(r.u.anio):""}${r.u.rc?` · <span style="font-family:ui-monospace,monospace;user-select:all">${esc(r.u.rc)}</span>`:""}</div>${(n=>n?`<div style="margin-top:6px"><span class="pill acc">Es noticia de ${esc(n.asesor||"sin asesor")} · ${esc(n.etapa||"")}</span></div>`:"")(notiDe(id))}</div>
    <div class="db">${FORMS.censoEdits.fields.map(f=>field(f,f[0]==="ocu"&&d.ocu&&!OCUPA.includes(d.ocu)?d.ocu:d[f[0]])).join("")}
    <div style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" type="button" data-act="ctoHoy">+ Contacto hoy</button><button class="btn small" type="button" data-act="informeViv">Informe de mercado</button><button class="btn small" type="button" data-act="aNoticia">${(S.contactos.find(c=>c.censoId===id))?"Abrir su noticia":"Pasar a noticia"}</button></div>${bloqueHist(S.censoEd[id]||{},true)}</div>
    <div class="df"><div class="right"><button class="btn" type="button" data-act="cerrar">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></div>`;
  const o=$("#fld-ocu"); if(d.ocu&&!OCUPA.includes(d.ocu)){o.insertAdjacentHTML("beforeend",`<option selected>${esc(d.ocu)}</option>`)}
  $("#dlg").showModal();
}

/* ---------- eventos ---------- */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;S.f.asesor="";if(S.view==="contactos"){S.f.etapa="activos";S.f.paso=""}try{localStorage.setItem("crm-view",S.view)}catch(_){}render();window.scrollTo(0,0)});
$("#view").addEventListener("click",e=>{const pp=e.target.closest("[data-pagp]");if(pp){const P=S.pag[pp.dataset.pagp];P.p+=+pp.dataset.d;render();const pg=$(`[data-pager="${pp.dataset.pagp}"]`);if(pg)pg.closest("section")?.scrollIntoView({block:"start"});e.stopImmediatePropagation();return}
  const hm=e.target.closest("[data-hoymas]");if(hm){S.hoyMas[hm.dataset.hoymas]=!S.hoyMas[hm.dataset.hoymas];render();e.stopImmediatePropagation();return}},true);
$("#view").addEventListener("change",e=>{const pn=e.target.closest("[data-pagn]");if(pn){const P=S.pag[pn.dataset.pagn];P.n=+pn.value;P.p=0;render()}});
$("#view").addEventListener("click",e=>{const eg=e.target.closest("[data-etapa-go]");if(eg){S.view="contactos";S.f.asesor="";S.f.paso="";S.f.etapa=eg.dataset.etapaGo;render();window.scrollTo(0,0);return}const g=e.target.closest("[data-go]");if(g){S.view="contactos";S.f.asesor="";S.f.etapa="activos";S.f.paso=g.dataset.go;render();window.scrollTo(0,0);return}const ke=e.target.closest("[data-kest]");if(ke){S.kf.estado=ke.dataset.kest;render();return}const ch=e.target.closest("[data-etapa]");if(ch){S.f.etapa=ch.dataset.etapa;render();return}if(e.target.id==="btn-perm"){(async()=>{try{const pm=await window.claude.use("permissions");await pm.manage();S.permDb=await pm.state("db");S.soloLectura=null;render()}catch(_){toast("Abre el menú Permisos de la página (arriba a la derecha)")}})();return}const pt=e.target.closest("[data-portal]");if(pt)return abrirPortal(pt.dataset.portal);const vv=e.target.closest("[data-viv]");if(vv)return abrirViv(vv.dataset.viv);const r=e.target.closest("[data-open]");if(r)return abrir(r.dataset.open,r.dataset.id);if(e.target.id==="btn-ajustes")abrirAjustes();if(e.target.id==="l-buscar")leerLoc();if(e.target.id==="l-limpiar"){S.lf={zona:"",calle:"",num:"",m2:"",dm2:"5",anio:"",danio:"3",tipo:"",planta:"",rc:""};render()}});
function leerLoc(){for(const k of ["zona","calle","num","m2","dm2","anio","danio","tipo","planta","rc"]){const el=$("#l-"+k);if(el)S.lf[k]=el.value}render()}
$("#view").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("l-")){e.preventDefault();leerLoc()}});
$("#view").addEventListener("input",e=>{const id=e.target.id;if(id==="f-q"||id==="c-q"||id==="k-q"){if(id==="f-q")S.f.q=e.target.value;else if(id==="k-q")S.kf.q=e.target.value;else S.cf.q=e.target.value;clearTimeout(render.t);render.t=setTimeout(()=>{render();const i=$("#"+id);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)}});
$("#view").addEventListener("change",e=>{const m={"f-asesor":"asesor","f-paso":"paso","f-estado":"estado"}[e.target.id];if(m){S.f[m]=e.target.value;render()}if(["l-zona","l-tipo"].includes(e.target.id))leerLoc();if(e.target.id==="k-zona"){S.kf.zona=e.target.value;render()}if(e.target.id==="k-asesor"){S.kf.asesor=e.target.value;render()}if(e.target.id==="c-zona"){S.cf.zona=e.target.value;render()}if(e.target.id==="c-ko"){S.cf.ko=e.target.checked;render()}});
document.addEventListener("click",e=>{if(e.target.id==="c-mapa"){S.cf.mapa=!S.cf.mapa;if(S.cf.mapa&&!S.geo&&S.db)S.db.doc("geo/parcelas").onSnapshot(s=>{S.geo=s.exists?s.data():{};if(S.view==="censo"&&S.cf.mapa)render()},()=>{S.geo={}});render();return}
  const cq=e.target.closest("[data-cq]");if(cq){S.cf.mapa=false;S.cf.q=cq.dataset.cq;render();window.scrollTo(0,0);return}
  const rp=e.target.closest("[data-resper]");if(rp){S.resPer=rp.dataset.resper;render();return}
  const pm=e.target.closest("[data-portalmapa]");if(pm){abrirPortal(pm.dataset.portalmapa);return}
  const pgb=e.target.closest("[data-pegar]");if(pgb){abrirPegar(S.cf.zona,+pgb.dataset.pegar);return}
  const tr=e.target.closest("[data-tara]");if(tr){const Z=S.censo&&S.censo[S.cf.zona],b=Z&&Z.edificios[+tr.dataset.tara];if(b)imprimirTaratura([{zona:S.cf.zona,b}]);return}
  if(e.target.id==="c-tara"){const L=S.cf.lista||[];if(!L.length){toast("No hay portales que imprimir");return}
    if(L.length>40&&!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent=`Son ${L.length} portales. Pulsa otra vez`;return}
    imprimirTaratura(L);return}});
$("#btn-new").addEventListener("click",()=>abrir({encargos:"encargos",operaciones:"operaciones",captaciones:"captaciones"}[S.view]||"contactos"));

try{const v=localStorage.getItem("crm-view");if(v&&FORMS[v]||v==="hoy"||v==="equipo"||v==="censo"||v==="localizar")S.view=v}catch(_){}
render();
(async()=>{
  const db=window.claude?await window.claude.use("db"):null; S.dbIntentado=true; if(!db) return render();
  try{const pm=await window.claude.use("permissions");if(pm){S.permDb=await pm.state("db");}}catch(_){}
  S.db=db;
  for(const col of ["contactos","encargos","operaciones","captaciones"]){
    db.collection(col).limit(1000).onSnapshot(s=>{S[col]=s.docs.map(d=>{const o={id:d.id,...d.data()};if(ETAPA_ANTIGUA[o.etapa])o.etapa=ETAPA_ANTIGUA[o.etapa];return o});if(!$("#dlg").open)render()},()=>{});
  }
  db.doc("zonas/indice").onSnapshot(s=>{if(!s.exists)return;const d=s.data(),I={};for(const [c,v] of Object.entries(d.calles||{})){const P={};for(const t of String(v).split(",")){const m=t.match(/^(\d+[A-Z]?)([A-Z])$/);if(m)P[m[1]]=(d.codigos||{})[m[2]]||""}I[c]=P}S.zidx=I},()=>{});
  db.doc("ajustes/general").onSnapshot(s=>{S.ajustes=s.exists?{...DEF_AJUSTES,...s.data()}:DEF_AJUSTES;render()},()=>{});
  render();
})();
$("#dlg").addEventListener("close",()=>render());
</script>
