/* Layout: barra de pestañas fija arriba, una columna de listas operativas; "Hoy" primero porque el CRM existe para que nada se quede sin próximo paso. */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --fg:#17211f; --muted:#5d6b68; --line:#dfe5e3;
  --accent:#0d6b62; --accent-soft:#e1f0ed; --on-accent:#ffffff;
  --ok:#2f7d3a; --ok-soft:#e5f3e6; --warn:#a86200; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101615; --surface:#18201f; --fg:#e4ecea; --muted:#9aaba7; --line:#2a3533;
  --accent:#4fc2b4; --accent-soft:#173532; --on-accent:#08201d;
  --ok:#7fcf88; --ok-soft:#1c3320; --warn:#f0b65a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#18201f; --fg:#e4ecea; --muted:#9aaba7; --line:#2a3533;
  --accent:#4fc2b4; --accent-soft:#173532; --on-accent:#08201d;
  --ok:#7fcf88; --ok-soft:#1c3320; --warn:#f0b65a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:6px 8px}
nav button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{padding-block:20px 60px;display:grid;gap:24px}
h2{font-family:var(--display);font-size:17px;margin:0 0 10px;text-wrap:balance}
h2 .n{color:var(--muted);font-family:var(--body);font-weight:500;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .m{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--line);color:var(--fg);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.zone{display:inline-flex;align-items:center;gap:5px}
.zone::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--z,#999);border:1px solid rgba(0,0,0,.15)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools input,.tools select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
.tools input[type=search]{flex:1 1 200px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
#view section{min-width:0;max-width:100%}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,20,18,.45);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none!important}
.modal form{display:flex;flex-direction:column;width:min(640px,100%);max-height:100%;background:var(--surface);color:var(--fg);border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dh{padding:16px 18px 8px;font-family:var(--display);font-size:18px;font-weight:700}
.db{padding:8px 18px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.db label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.db label.full{grid-column:1/-1}
.db label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.db input,.db select,.db textarea{font:inherit;font-size:15px;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.db textarea{min-height:90px;resize:vertical}
.db label.check input{width:auto}
.df{display:flex;justify-content:space-between;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .right{display:flex;gap:8px;margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);padding:6px 12px;border-radius:16px;cursor:pointer}
.chip span{color:var(--muted);font-weight:500;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] span{color:var(--on-accent)}
details.bld{border-top:1px solid var(--line)} details.bld:first-child{border-top:0}
details.bld summary{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;padding:11px 14px;cursor:pointer;list-style:none}
details.bld summary::-webkit-details-marker{display:none}
details.bld summary .t{font-weight:600} details.bld summary .m{font-size:13px;color:var(--muted)}
details.bld[open] summary{background:var(--accent-soft)}
details.bld .tbl-wrap{border:0;border-radius:0;border-top:1px solid var(--line)}
.portal{display:grid;gap:6px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}.portal .pi{display:flex;flex-wrap:wrap;gap:4px}.portal .po{color:var(--muted)}.portal .btn{justify-self:start}
.pbar{display:flex;height:6px;background:var(--line);overflow:hidden;max-width:320px}.pbar i{display:block;height:100%}
.kos{display:grid;gap:8px;padding:10px 14px}
.ko{font-size:14px} .ko .s{font-size:13px;color:var(--muted);margin-top:2px}
tr.viv{cursor:pointer} tr.viv:hover td{background:var(--accent-soft)} tr.viv.ed td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.hist{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.hist .hl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.he{font-size:14px;line-height:1.4;border-left:2px solid var(--line);padding-left:10px}
.he .hf{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.he .hn{white-space:pre-wrap} .he .hc{font-size:13px;color:var(--muted)} .he s{opacity:.75}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}
/* Estilo de hogaresgroup.es: cabecera antracita, dorado #ac9465, titulares con serifa, botones y cajas rectos */
:root{--bg:#f7f6f4;--surface:#ffffff;--fg:#333130;--muted:#706e6a;--line:#e4e1dd;--accent:#8a7346;--accent-soft:#f3eee4;--on-accent:#ffffff;--oro:#ac9465;--antracita:#333130;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;--body:"Roboto",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--surface:#242321;--fg:#ebe8e3;--muted:#a6a29b;--line:#3a3835;--accent:#c9b282;--accent-soft:#332d22;--on-accent:#1b1a19;--oro:#ac9465;--antracita:#2a2826}}
:root[data-theme="dark"]{--bg:#1b1a19;--surface:#242321;--fg:#ebe8e3;--muted:#a6a29b;--line:#3a3835;--accent:#c9b282;--accent-soft:#332d22;--on-accent:#1b1a19;--oro:#ac9465;--antracita:#2a2826}
body{margin:0}
body::before{background:var(--antracita)}
header{background:var(--antracita);border-bottom:0;color:#fff}
h1{font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--oro);font-size:22px;display:flex;align-items:center;gap:10px}
h1 small{color:#bdb8af;text-transform:none;letter-spacing:0;font-weight:400;margin-left:0}
h1::before{content:"";width:57px;height:22px;background:url(logo-casa.png) center/contain no-repeat}
#login .lbox h1{flex-direction:column;align-items:flex-start;font-size:30px;gap:6px}
#login .lbox h1::before{width:88px;height:34px}
.yo{color:#bdb8af}
header .btn{border-radius:0;background:transparent;border-color:#5a5651;color:#fff}
header .btn.primary,.btn.primary{background:var(--oro);border-color:var(--oro);color:#fff}
nav button{color:#d6d2ca;border-radius:0;border-bottom:2px solid transparent}
nav button[aria-current="true"]{background:none;color:var(--oro);border-bottom-color:var(--oro)}
nav button:hover{color:#fff}
h2,.dh,.kpi .v{font-family:var(--display);font-weight:600}
h2{font-size:21px;letter-spacing:0}
.lbox h1{color:var(--oro)} #login.login{background:var(--antracita)} .lbox p,.lmsg{color:#d6d2ca}
#login .lbox input{border-radius:0;border-color:#5a5651;background:#fff;color:#333130} #login .lbox p,#login .lmsg{color:#d6d2ca}
.btn,.chip,.kpi,.list,.tbl-wrap,.banner,.modal form,.tools input,.tools select,.db input,.db select,.db textarea,.lbox input,.bar,.bar i{border-radius:0}
.pill{border-radius:2px}
.tools input,.tools select,.db input,.db select,.db textarea{border-color:#cccccc}
.db input,.db select,.db textarea{background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--oro);border-color:var(--oro);color:#fff}
.chip[aria-pressed="true"] span{color:#fff}
.bar i{background:var(--oro)}
.btn{font-weight:500}
.login{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.login[hidden]{display:none}
.lbox{max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
#l-paso1{display:flex;flex-direction:column;gap:12px}
.lbox h1{margin:0 0 4px}.lbox p{margin:0;color:var(--muted)}
.lbox input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.lmsg{min-height:1.4em}
.yo{display:flex;gap:8px;align-items:center;margin-left:auto;margin-right:8px;font-size:13px;color:var(--muted)}
</style>

<script>
/* Ventana propia en vez de <dialog>: en algunas vistas de la app showModal() no abre nada. */
(function(){const d=document.getElementById("dlg");d.open=false;
  d.showModal=function(){d.hidden=false;d.open=true;document.body.style.overflow="hidden";setTimeout(()=>{const f=d.querySelector("input,select,textarea");if(f&&window.innerWidth>700)f.focus()},30)};
  d.close=function(){if(!d.open)return;d.hidden=true;d.open=false;document.body.style.overflow="";d.dispatchEvent(new Event("close"))};
  d.addEventListener("click",e=>{if(e.target===d)d.close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&d.open)d.close()});})();
const ZONAS = {VERDE:"#3a9a4a",AZUL:"#2f6fd0",AMARILLA:"#e3b300",ROJA:"#cf3b30",ROSA:"#e57ab0",NARANJA:"#ee8a2a",MORADA:"#7d4fc4",MARRON:"#8a5a35",BLANCA:"#f2f2f2"};
const ETAPAS = ["Desarrollo","Seguimiento","Paralizado","Valoración agendada","Valorada","Encargo","KO"];
const ETAPA_ANTIGUA = {"Noticia":"Desarrollo","En seguimiento":"Seguimiento"};
const ORIGENES = ["Lead central (con contacto)","Consulta de valor (solo dirección)","Otra oficina Hogares","Puerta fría / buzoneo","Llamada a oficina","Particular que vende solo","Con otra agencia","Base de datos antigua","Recomendación","Otro"];
const MOTIVOS = ["","Herencia","Divorcio","Extinción de condominio","Cambio de vivienda","Inversor","Vacío","Alquilado","Otro"];
const EST_ENC = ["Activo","Reservado","Vendido","Retirado","Devuelto"];
const EST_OP = ["Reserva","Aceptada","Arras","Escriturada","Caída"];
const DEF_AJUSTES = {asesores:[{nombre:"Carlos",zona:"ROSA"},{nombre:"Iván",zona:"AZUL"},{nombre:"Sergio",zona:"AMARILLA"},{nombre:"Mery",zona:"VERDE"},{nombre:"Mario",zona:""}],
  objetivoMes:40000,objetivoPeriodo:200000,periodoInicio:"2026-10-01",periodoFin:"2026-12-31",gastosMes:24000,diasRevisionPrecio:30};

const S = {view:"hoy",contactos:[],encargos:[],operaciones:[],captaciones:[],ajustes:DEF_AJUSTES,db:null,censo:null,censoEd:{},portales:{},f:{q:"",asesor:"",etapa:"activos",paso:"",estado:"Activo"},cf:{zona:"",q:"",ko:false},kf:{zona:"",asesor:"",estado:"Pendiente",q:""},lf:{zona:"",calle:"",m2:"",dm2:"5",anio:"",danio:"3",tipo:"",planta:"",rc:""}};
const $ = s=>document.querySelector(s);
const esc = v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n=>(Number(n)||0).toLocaleString("es-ES",{maximumFractionDigits:0})+" €";
const hoyISO = ()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dias = (a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fmtF = s=>s?new Date(s+"T12:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short"}):"";
const zona = z=>z?`<span class="zone" style="--z:${ZONAS[z]||"#999"}">${esc(z.charAt(0)+z.slice(1).toLowerCase())}</span>`:"";
const personas = ()=>[...S.ajustes.asesores.map(a=>a.nombre),"Stiwhar","OFICINA"];
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}

/* ---------- reglas de negocio ---------- */
function urgPub(c){
  if(!c.publicado||c.etapa!=="Desarrollo") return null;
  const lim=c.publicado==="Particular"?1:2,d0=new Date((c.fechaPublicado||hoyISO())+"T12:00");d0.setDate(d0.getDate()+lim);
  const lv=d0.toISOString().slice(0,10),d=dias(hoyISO(),lv);
  return {limite:lv,d,cls:d<=0?"bad":"warn",txt:d<0?`Publicada sin localizar: venció hace ${-d} d`:d===0?"Publicada: localizar HOY":`Publicada: localizar antes del ${fmtF(lv)}`};
}
const urgentes=()=>S.contactos.filter(urgPub).sort((a,b)=>urgPub(a).limite.localeCompare(urgPub(b).limite));
function proxEstado(c){
  if(c.etapa==="KO"||c.etapa==="Encargo") return null;
  if(!c.proxFecha) return {cls:"bad",txt:"Sin próximo paso"};
  const d=dias(hoyISO(),c.proxFecha);
  if(d<0) return {cls:"bad",txt:`Vencido hace ${-d} d`};
  if(d===0) return {cls:"warn",txt:"Hoy"};
  return {cls:"",txt:fmtF(c.proxFecha)};
}
function alertaEncargo(e){
  const out=[]; if(e.estado!=="Activo") return out;
  const base=[e.fechaCaptacion,e.ultimaRevisionPrecio].filter(Boolean).sort().pop();
  if(base){const d=dias(base,hoyISO()); if(d>=S.ajustes.diasRevisionPrecio) out.push({cls:"bad",txt:`Revisar precio (${d} d)`});}
  if(e.exclusiva==="Sí"&&e.finExclusiva){const d=dias(hoyISO(),e.finExclusiva); if(d<0) out.push({cls:"warn",txt:"Exclusiva vencida: confirmar renovación"}); else if(d<=10) out.push({cls:"warn",txt:`Exclusiva vence en ${d} d`});}
  if(e.exclusiva!=="Sí") out.push({cls:"warn",txt:"Sin exclusiva"});
  return out;
}

let censoCargando=false;
async function cargarCenso(){
  if(censoCargando) return; censoCargando=true;
  try{const s=await S.db.collection("censo").limit(200).get(); const C={};
    for(const d of s.docs){const o=JSON.parse(JSON.stringify(d.data())),z=C[o.zona]||(C[o.zona]={edificios:[],resumen:null,koSinUbicar:[]});
      if(o.resumen){z.resumen=o.resumen;z.koSinUbicar=o.koSinUbicar||[]} else {o.edificios.forEach((b,bi)=>b.u.forEach((u,ui)=>u._id=d.id+"."+bi+"."+ui));z.parts=(z.parts||[]).concat([[o.parte,o.edificios]]);}}
    for(const z of Object.values(C)){z.edificios=(z.parts||[]).sort((a,b)=>a[0]-b[0]).flatMap(p=>p[1]);delete z.parts}
    S.censo=C; if(!S.cf.zona) S.cf.zona=Object.keys(C).sort()[0]||"";
    S.db.collection("portales").limit(5000).onSnapshot(sn=>{S.portales={};sn.docs.forEach(x=>S.portales[x.id]=x.data());if(S.view==="censo"&&!$("#dlg").open)render()},()=>{});
    S.db.collection("censoEdits").limit(1000).onSnapshot(sn=>{S.censoEd={};sn.docs.forEach(x=>S.censoEd[x.id]=x.data());if(S.view==="censo"&&!$("#dlg").open)render()},()=>{});
  }catch(e){toast("No se ha podido cargar el censo")}
  censoCargando=false; if(S.view==="censo"||S.view==="localizar") render();
}

  const m2=parseFloat(f.m2),dm=parseFloat(f.dm2)||0,an=parseInt(f.anio),da=parseInt(f.danio)||0,calle=f.calle.trim()?zCalle(f.calle):"",rc=f.rc.replace(/\s/g,"").toUpperCase(),pl=f.planta.trim().toUpperCase().replace(/^0+(?=\d)/,"").replace(/[ºª°]/g,"");

  const R=[];
  for(const [zn,Z] of Object.entries(S.censo)){ if(f.zona&&zn!==f.zona) continue;
    for(const b of Z.edificios){ if(calle&&!zCalle(b.via).includes(calle)) continue;

async function guardar(col,id,data,nota){
  if(!S.db){toast("Sin conexión: no se ha guardado");return null}

  const cambios=old?Object.keys(data).filter(k=>!["actualizado","historial","creado","noticia","borrarSolicitado","vendidaVista"].includes(k)&&String(old[k]??"")!==String(data[k]??"")&&!(old[k]==null&&data[k]===false))
    .map(k=>({campo:etiqueta(col,k),antes:String(old[k]??"").slice(0,200),despues:String(data[k]??"").slice(0,200)})):[];
  const out={...(old||{}),...data}; delete out.id; delete out._id; out.actualizado=ahora;
  const hist=[...((old&&old.historial)||[])];
  if(!old||cambios.length||nota) hist.push({f:ahora,...(old?{}:{alta:true}),...(cambios.length?{c:cambios}:{}),...(nota?{n:nota}:{})});
  out.historial=hist.slice(-300);
  try{ if(id){await S.db.collection(col).doc(id).set(out);return id}
       const r=S.db.collection(col).doc(); out.creado=ahora; await r.set(out); return r.id; }
  catch(e){console.error("guardar",col,e);S.soloLectura=e.code||e.message||"error";toast(e.code==="quota_exceeded"?"La base de datos está llena: borra registros antiguos":"No se ha guardado: "+(e.code||"")+" "+(e.message||""));return null}
}

/* ---------- zona por dirección (índice sacado del censo) ---------- */
const ZTIPOS=/^\s*(C\/|(?:CL|CALLE|AV|AVD|AVDA|AVENIDA|PZA|PZ|PL|PLAZA|PASEO|PS|PSO|CAMINO|CM|CTRA|CARRETERA|TRAVESIA|TR|GLORIETA|GTA|RONDA|RD|URB|URBANIZACION)(?:\.|\s|\/)+)/;
const zUp=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
const zCalle=t=>zUp(t).replace(ZTIPOS,"").replace(/\b(DE|DEL|LA|LAS|LOS|EL)\b/g," ").replace(/[^A-Z0-9]/g,"");
function zonaDe(dir){
  const I=S.zidx; if(!I||!dir) return "";
  const a=zUp(dir).replace(ZTIPOS,""),m=a.match(/^(.*?[A-Z].*?)[\s,.ºª-]*(\d+)([A-Z](?![A-Z]))?/);
  const c=zCalle(m?m[1]:a),n=m?+m[2]:null,l=m&&m[3]||""; let P=I[c];
  if(!P&&c.length>=5){const ks=Object.keys(I).filter(k=>k.includes(c)||(k.length>=5&&c.includes(k)));if(ks.length===1)P=I[ks[0]]}
  if(!P) return "";
  if(n!=null&&P[n+l]) return P[n+l];
  if(n!=null&&P[n]) return P[n];
  const zs=[...new Set(Object.values(P))]; if(zs.length===1) return zs[0];
  if(n==null) return "";
  let best="",bd=1e9; for(const [k0,z] of Object.entries(P)){const k=parseInt(k0);const d=Math.abs(k-n)+(k%2===n%2?0:1000);if(d<bd){bd=d;best=z}} return best;
}

function viviendaDeDir(dir){
  if(!S.censo||!dir) return null;
  const a=zUp(dir).replace(ZTIPOS,""),m=a.match(/^(.*?[A-Z].*?)[\s,.ºª-]*(\d+)/); if(!m) return null;
  const c=zCalle(m[1]),n=+m[2],rest=a.slice(m.index+m[0].length),pp=rest.match(/(\d+|BJ|BAJO)\s*[ºª°]?\s*-?\s*([A-Z]|\d+)\b/),z0=t=>String(t||"").toUpperCase().replace(/^0+(?=\d)/,"");
  for(const Z of Object.values(S.censo)) for(const b of Z.edificios){
    if(zCalle(b.via)!==c||parseInt(b.num)!==n) continue;
    if(pp){const u=b.u.find(u=>z0(u.planta)===z0(pp[1])&&z0(u.puerta)===z0(pp[2]));if(u) return u._id}
    if(b.u.length===1) return b.u[0]._id;

}

const DOCS={"ajustes/general":"general","zonas/indice":"zonas_indice"};
const nuevoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function fila(t,id,d){const r={id,d};if(t==="censo")r.zona=d.zona;if(t==="censo_edits"||t==="portales")r.zona=id.split("-")[0].toUpperCase();return r}
function fallo(error){const e=new Error(error.message||"error");e.code=error.code==="42501"?"sin_permiso":error.code;return e}
async function leerTabla(t,filtro){let out=[];for(let from=0;;from+=500){let q=sb.from(t).select("id,d").range(from,from+499);if(filtro)q=filtro(q);const {data,error}=await q;if(error)throw fallo(error);out=out.concat(data);if(data.length<500)break}return out}
const snapCol=rows=>({docs:rows.map(r=>({id:r.id,data:()=>r.d}))});
const snapDoc=r=>({exists:!!r,data:()=>r?r.d:undefined});
function enVivo(t,recargar){let tm=null;sb.channel("rt-"+t+"-"+nuevoId()).on("postgres_changes",{event:"*",schema:"public",table:t},()=>{clearTimeout(tm);tm=setTimeout(recargar,400)}).subscribe()}
function coleccion(nombre){
  const t=TABLA[nombre];
  const api={
    limit(){return api},
    async get(){return snapCol(await leerTabla(t))},
    onSnapshot(cb,err){const go=()=>leerTabla(t).then(r=>cb(snapCol(r))).catch(e=>err&&err(e));go();enVivo(t,go);return()=>{}},
    doc(id){id=id||nuevoId();return{id,
      async set(d){const {error}=await sb.from(t).upsert(fila(t,id,d));if(error)throw fallo(error)},
      async delete(){const {error}=await sb.from(t).delete().eq("id",id);if(error)throw fallo(error)}}}
  };return api}
function documento(ruta){
  const id=DOCS[ruta];
  const leer=async()=>{const {data,error}=await sb.from("ajustes").select("id,d").eq("id",id).maybeSingle();if(error)throw fallo(error);return data};
  return{onSnapshot(cb,err){const go=()=>leer().then(r=>cb(snapDoc(r))).catch(e=>err&&err(e));go();enVivo("ajustes",go);return()=>{}},
    async set(d){const {error}=await sb.from("ajustes").upsert({id,d});if(error)throw fallo(error)}}}
const dbSupabase={collection:coleccion,doc:documento};

/* ---------- quién soy ---------- */
const esResp=()=>S.yo&&S.yo.rol==="responsable";
function ajustarPorRol(){
  $("#yo-nombre").textContent=S.yo?S.yo.nombre:"";
  const eq=document.querySelector('#tabs [data-v="equipo"]');if(eq)eq.hidden=!esResp();
  if(!esResp()&&S.view==="equipo")S.view="hoy";
  if(!esResp())S.f.asesor="";
}
const _render=render;
render=function(){_render();if(!S.yo)return;
  if(!esResp()){const b=$("#btn-ajustes");if(b)b.closest("section").remove();$("#btn-new").hidden=S.view==="operaciones"}
  else if(S.view==="equipo"&&!$("#accesos")){$("#view").insertAdjacentHTML("beforeend",`<section id="accesos"><h2>Accesos</h2><div class="list" id="acc-list"><div class="empty">Cargando…</div></div></section>`);
    sb.rpc("accesos").then(({data,error})=>{const L=$("#acc-list");if(!L)return;if(error){L.innerHTML=`<div class="empty">No se han podido cargar los accesos</div>`;return}
      const hace=t=>{if(!t)return"Nunca ha entrado";const m=Math.round((Date.now()-new Date(t))/60000);return m<1?"Ahora mismo":m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`};
      L.innerHTML=data.map(a=>`<div class="row"><span class="t">${esc(a.nombre)}</span><span class="r"><span class="pill ${a.ultimo_acceso?(Date.now()-new Date(a.ultimo_acceso)>3*864e5?"warn":"ok"):"bad"}">${esc(hace(a.ultimo_acceso))}</span></span><span class="m"><span>${a.zona?zona(a.zona):"Responsable"}</span><span>${esc(a.email)}</span>${a.ultimo_acceso?`<span>Último acceso ${fmtFH(a.ultimo_acceso)}</span>`:""}</span></div>`).join("")})}
  if(esResp()&&S.view==="equipo"&&!$("#btn-importar")){$("#view").insertAdjacentHTML("beforeend",`<section><h2>Pasar datos al CRM del equipo</h2><p style="margin:0 0 8px;color:var(--muted);font-size:13px">Sube el archivo de datos que te ha preparado Claude. Si una ficha ya existe, se sustituye por la del archivo; no se duplica nada.</p><div class="tools"><input type="file" id="imp-file" accept=".json,application/json"><button class="btn" type="button" id="btn-importar">Importar</button></div><p id="imp-msg" style="color:var(--muted);font-size:13px"></p></section>`)}
};
const _abrir=abrir;
abrir=function(col,id){if(!esResp()&&col==="operaciones"&&!id){toast("Las operaciones las da de alta Stiwhar");return}
  _abrir(col,id);if(esResp())return;
  document.querySelectorAll('#frm [data-act="aOp"]').forEach(b=>b.remove());
  if(col==="operaciones"){document.querySelectorAll("#frm input,#frm select,#frm textarea").forEach(e=>e.disabled=true);
    const df=document.querySelector("#frm .df");if(df)df.innerHTML=`<span style="color:var(--muted);font-size:13px">Solo lectura: las operaciones las gestiona Stiwhar.</span><div class="right"><button class="btn" type="button" data-act="cerrar">Cerrar</button></div>`;
    const nn=$("#fld-nuevaNota");if(nn)nn.closest("label").remove();return}
  document.querySelectorAll('#frm [data-act="aprobarBorrar"],#frm [data-act="rechazarBorrar"]').forEach(b=>b.remove());
  const fa=$("#fld-asesor");if(fa&&fa.tagName==="SELECT"){if(![...fa.options].some(o=>o.value===S.yo.nombre))fa.add(new Option(S.yo.nombre,S.yo.nombre));fa.value=S.yo.nombre;fa.disabled=true}};

/* ---------- importar (solo responsable) ---------- */
async function importar(){
  const f=$("#imp-file").files[0],msg=$("#imp-msg");if(!f)return toast("Elige primero el archivo");
  let J;try{J=JSON.parse(await f.text())}catch(_){return toast("El archivo no es válido")}
  const trabajos=[];
  for(const [col,docs] of Object.entries(J)){
    if(col==="ajustes"||col==="zonas"){for(const [k,d] of Object.entries(docs))trabajos.push(["ajustes",{id:DOCS[col+"/"+k]||k,d}]);continue}
    const t=TABLA[col];if(!t)continue;for(const [id,d] of Object.entries(docs))trabajos.push([t,fila(t,id,d)]);
  }
  const porTabla={};trabajos.forEach(([t,r])=>(porTabla[t]=porTabla[t]||[]).push(r));
  let hechos=0;const total=trabajos.length;
  try{for(const [t,rows] of Object.entries(porTabla)){const lote=t==="censo"?4:200;
      for(let i=0;i<rows.length;i+=lote){const {error}=await sb.from(t).upsert(rows.slice(i,i+lote));if(error)throw fallo(error);hechos+=Math.min(lote,rows.length-i);msg.textContent=`Importando… ${hechos} de ${total}`}}
    msg.textContent=`Hecho: ${total} registros importados.`;S.censo=null;toast("Datos importados")}
  catch(e){msg.textContent=`Se ha parado en ${hechos} de ${total}: ${e.message}. Puedes volver a importar el mismo archivo sin duplicar nada.`}
}

/* ---------- acceso ---------- */
function verLogin(texto){$("#login").hidden=false;$("#l-msg").textContent=texto||""}
$("#l-enviar").addEventListener("click",async()=>{
  const email=$("#l-email").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return verLogin("Escribe un email válido.");
  $("#l-enviar").disabled=true;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  $("#l-enviar").disabled=false;
  verLogin(error?(error.status===429||/rate limit|seconds/i.test(error.message)?"Ahora mismo hay demasiados accesos pidiendo enlace. Espera una hora y pulsa una sola vez; no hace falta repetir.":"No se ha podido enviar: "+error.message):"Te hemos enviado un enlace a "+email+". Ábrelo en este mismo dispositivo.");
});
$("#l-email").addEventListener("keydown",e=>{if(e.key==="Enter")$("#l-enviar").click()});
$("#btn-salir").addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});
$("#view").addEventListener("click",e=>{if(e.target.id==="btn-importar")importar()});

let arrancado=false;
async function arrancar(sesion){
  if(arrancado)return;
  const {data:yo,error}=await sb.from("perfiles").select("nombre,rol,zona").eq("id",sesion.user.id).maybeSingle();
  if(error||!yo||yo.activo===false){verLogin("Tu email ("+sesion.user.email+") no está dado de alta en el CRM. Pídele a Stiwhar que te añada.");$("#l-paso1").hidden=true;
    if(!$("#l-otro")){$("#l-msg").insertAdjacentHTML("afterend",'<button class="btn" type="button" id="l-otro">Entrar con otro email</button>');$("#l-otro").onclick=async()=>{await sb.auth.signOut();location.reload()}}return}
  arrancado=true;$("#login").hidden=true;S.yo=yo;ajustarPorRol();
  const db=dbSupabase;S.dbIntentado=true;S.db=db;
  for(const col of ["contactos","encargos","operaciones","captaciones"]){
    db.collection(col).limit(1000).onSnapshot(s=>{S[col]=s.docs.map(d=>{const o={id:d.id,...d.data()};if(ETAPA_ANTIGUA[o.etapa])o.etapa=ETAPA_ANTIGUA[o.etapa];return o});if(!$("#dlg").open)render()},()=>{});
  }
  db.doc("zonas/indice").onSnapshot(s=>{if(!s.exists)return;const d=s.data(),I={};for(const [c,v] of Object.entries(d.calles||{})){const P={};for(const t of String(v).split(",")){const m=t.match(/^(\d+[A-Z]?)([A-Z])$/);if(m)P[m[1]]=(d.codigos||{})[m[2]]||""}I[c]=P}S.zidx=I},()=>{});
  db.doc("ajustes/general").onSnapshot(s=>{S.ajustes=s.exists?{...DEF_AJUSTES,...s.data()}:DEF_AJUSTES;render()},()=>{});
  render();
}
(async()=>{
  if(!sb){S.dbIntentado=true;return render()}
  sb.auth.onAuthStateChange((ev,sesion)=>{if(sesion)arrancar(sesion)});
  const {data:{session}}=await sb.auth.getSession();
  if(session)arrancar(session);else verLogin("");
})();
$("#dlg").addEventListener("close",()=>render());
</script>
