#frm .db{flex:1 1 auto;align-content:start}#frm .dh{position:relative;padding-right:56px}.dx{position:absolute;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);color:var(--fg);font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}.dx:hover{background:var(--line)}.fcuerpo{display:flex;flex:1 1 auto;min-height:0}.fcuerpo>.db{flex:1 1 auto;min-width:0}.flat{flex:0 0 340px;overflow-y:auto;border-left:1px solid var(--line);background:var(--bg);padding:12px 16px}.flat .hist{margin:0;border:0;padding:0}@media (min-width:1000px){#frm:has(.flat){width:min(1120px,100%);height:min(720px,100%)}}.ftabs.desb{-webkit-mask-image:linear-gradient(to right,#000 80%,transparent);mask-image:linear-gradient(to right,#000 80%,transparent)}.ftabs.desb.fin{-webkit-mask-image:none;mask-image:none}.fdias{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:-4px}.fdias .btn{flex:none;padding:5px 11px!important;min-height:0!important;font-size:13px!important}@media (max-width:700px){#frm .db:has(>.fpane){grid-template-columns:1fr 1fr;column-gap:10px}#frm .db>.fpane>*{grid-column:1/-1}#frm .db>.fpane>.mitad{grid-column:auto}.facc{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}.facc::-webkit-scrollbar{display:none}.facc .btn{flex:none;padding:7px 14px;min-height:0;font-size:14px}#frm:has(.ftabs) .df{padding:10px 18px}#frm:has(.ftabs) .df .right{width:100%}}@media (min-width:701px){#frm:has(.ftabs){height:min(780px,100%)}}.fpane{display:contents}.fpane[hidden]{display:none!important}

(function(){const d=document.getElementById("dlg");d.open=false;

function clientesAntiguos(){const hoy=hoyISO(),out=[];
  for(const o of S.operaciones){if(o.estado==="Caída")continue;const base=o.fechaEscritura||o.fechaCobro||(o.estado==="Escriturada"?o.fechaAceptacion:"");if(!base)continue;

    if(dd>=15&&!o.resenaPedida)out.push({o,orden:0,txt:"Pedir reseña de Google",cls:"warn",det:`Vendida hace ${dd} días`});
    const y=+base.slice(0,4),ny=+hoy.slice(0,4);for(const yy of [ny,ny+1]){const an=yy+base.slice(4),n=yy-y,falta=dias(hoy,an);

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function rangoPer(per){const h=new Date();h.setHours(0,0,0,0);let a,b;

/* ---------- «A quién llamar hoy»: probabilidad de vender ---------- */

/* ---------- zona por dirección (índice sacado del censo) ---------- */
const ZTIPOS=/^\s*(C\/|(?:CL|CALLE|AV|AVD|AVDA|AVENIDA|PZA|PZ|PL|PLAZA|PASEO|PS|PSO|CAMINO|CM|CTRA|CARRETERA|TRAVESIA|TR|GLORIETA|GTA|RONDA|RD|URB|URBANIZACION)(?:\.|\s|\/)+)/;
const zUp=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
const zCalle=t=>zUp(t).replace(ZTIPOS,"").replace(/\b(DE|DEL|LA|LAS|LOS|EL)\b/g," ").replace(/[^A-Z0-9]/g,"");
function zonaDe(dir){
  const I=S.zidx; if(!I||!dir) return "";
  const a=zUp(dir).replace(ZTIPOS,""),m=a.match(/^(.*?[A-Z].*?)[\s,.ºª-]*(\d+)([A-Z](?![A-Z]))?/);
  const c=zCalle(m?m[1]:a),n=m?+m[2]:null,l=m&&m[3]||""; let P=I[c];
  if(!P&&c.length>=5){const ks=Object.keys(I).filter(k=>k.includes(c)||(k.length>=5&&c.includes(k)));if(ks.length===1)P=I[ks[0]]}
  if(!P) return "";
  if(n!=null&&P[n+l]) return P[n+l];
  if(n!=null&&P[n]) return P[n];
  const zs=[...new Set(Object.values(P))]; if(zs.length===1) return zs[0];
  if(n==null) return "";
  let best="",bd=1e9; for(const [k0,z] of Object.entries(P)){const k=parseInt(k0);const d=Math.abs(k-n)+(k%2===n%2?0:1000);if(d<bd){bd=d;best=z}} return best;
}

  const m=a.match(/^(.*?[A-Z].*?)[\s,.ºª°-]*(?:N[ºª°]\s*)?(\d+)(?:(BIS|[A-F])(?![A-Z0-9])|\s+(BIS)\b)?/); if(!m) return {c:zCalle(a)};
  let rest=a.slice(m.index+m[0].length);
  const o={c:zCalle(m[1]),n:+m[2]};if(m[3]||m[4])o.letra=m[3]||m[4];
  const e=rest.match(/\b(?:ESC(?:ALERA)?|PORTAL|P|BLOQ(?:UE)?|BLQ|E)\.?\s*:?\s*(\d+|IZQ\w*|DCH\w*|DER\w*)\b/);
  if(e){o.esc=/^IZQ/.test(e[1])?"I":/^(DCH|DER)/.test(e[1])?"D":String(+e[1]);rest=rest.slice(0,e.index)+" "+rest.slice(e.index+e[0].length)}

  const p=rest.match(/(?:^|[\s,.-])(BAJO|BJ|B|\d{1,2})\s*[ºª°]?\s*[-\s]?\s*([A-H]|\d{1,2})\b/)||rest.match(/(?:^|[\s,.-])(BAJO|BJ|B|\d{1,2})[ºª°]?([A-H])\b/);
  if(p){o.planta=/^B/.test(p[1])?"0":String(+p[1]);o.puerta=/^\d+$/.test(p[2])?String(+p[2]):p[2]}
  else{const p2=rest.match(/(?:^|[\s,.-])(BAJO|BJ|\d{1,2})\s*[ºª°]?\s*$/);if(p2)o.plantaSola=/^B/.test(p2[1])?"0":String(+p2[1])}
  return o;
}

function candidatosViv(dir,buscar){

  for(const [zn,Z] of Object.entries(C))for(const b of Z.edificios)if(zCalle(b.via)===P.c&&bOk(b))B.push([zn,b]);
  if(!B.length&&P.c.length>=(buscar?3:5)){const ks=new Set();for(const Z of Object.values(C))for(const b of Z.edificios){const k=zCalle(b.via);if(buscar?k.includes(P.c):(k.includes(P.c)||P.c.includes(k)&&k.length>=5))ks.add(k)}

  if(P.planta!=null)U=U.filter(x=>zPl(x.u.planta)===P.planta&&zPP(x.u.puerta)===zPP(P.puerta));
  if(buscar&&P.plantaSola!=null)U=U.filter(x=>zPl(x.u.planta)===P.plantaSola);

  return {P,u:U,edificios:B.length};
}

$("#view").addEventListener("click",e=>{const eg=e.target.closest("[data-etapa-go]");if(eg){S.view="contactos";S.f.asesor="";S.f.paso="";S.f.etapa=eg.dataset.etapaGo;render();window.scrollTo(0,0);return}const g=e.target.closest("[data-go]");if(g){S.view="contactos";S.f.asesor="";S.f.etapa="activos";S.f.paso=g.dataset.go;render();window.scrollTo(0,0);return}const ke=e.target.closest("[data-kest]");if(ke){S.kf.estado=ke.dataset.kest;render();return}const ch=e.target.closest("[data-etapa]");if(ch){S.f.etapa=ch.dataset.etapa;render();return}if(e.target.id==="btn-perm"){(async()=>{try{const pm=await window.claude.use("permissions");await pm.manage();S.permDb=await pm.state("db");S.soloLectura=null;render()}catch(_){toast("Abre el menú Permisos de la página (arriba a la derecha)")}})();return}const pt=e.target.closest("[data-portal]");if(pt)return abrirPortal(pt.dataset.portal);const vv=e.target.closest("[data-viv]");if(vv)return abrirViv(vv.dataset.viv);const nv=e.target.closest("[data-nsviv]");if(nv){const i=nv.dataset.nsviv;return (S.censo?Promise.resolve():cargarCenso()).then(()=>abrirViv(i))}const r=e.target.closest("[data-open]");if(r)return abrir(r.dataset.open,r.dataset.id);if(e.target.id==="btn-ajustes")abrirAjustes();if(e.target.id==="l-buscar")leerLoc();if(e.target.id==="l-limpiar"){S.lf={zona:"",calle:"",num:"",m2:"",dm2:"5",anio:"",danio:"3",tipo:"",planta:"",rc:""};render()}});
function leerLoc(){for(const k of ["zona","calle","num","m2","dm2","anio","danio","tipo","planta","rc"]){const el=$("#l-"+k);if(el)S.lf[k]=el.value}render()}
$("#view").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("l-")){e.preventDefault();leerLoc()}});
$("#view").addEventListener("input",e=>{const id=e.target.id;if(id==="f-q"||id==="c-q"||id==="k-q"){if(id==="f-q")S.f.q=e.target.value;else if(id==="k-q")S.kf.q=e.target.value;else S.cf.q=e.target.value;clearTimeout(render.t);render.t=setTimeout(()=>{render();const i=$("#"+id);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)}});
$("#view").addEventListener("change",e=>{const m={"f-asesor":"asesor","f-paso":"paso","f-estado":"estado"}[e.target.id];if(m){S.f[m]=e.target.value;render()}if(["l-zona","l-tipo"].includes(e.target.id))leerLoc();if(e.target.id==="k-zona"){S.kf.zona=e.target.value;render()}if(e.target.id==="k-asesor"){S.kf.asesor=e.target.value;render()}if(e.target.id==="c-zona"){S.cf.zona=e.target.value;render()}if(e.target.id==="c-ko"){S.cf.ko=e.target.checked;render()}});
document.addEventListener("click",e=>{if(e.target.id==="c-mapa"){S.cf.mapa=!S.cf.mapa;if(S.cf.mapa&&!S.geo&&S.db)S.db.doc("geo/parcelas").onSnapshot(s=>{S.geo=s.exists?s.data():{};if(S.view==="censo"&&S.cf.mapa)render()},()=>{S.geo={}});render();return}
  const cq=e.target.closest("[data-cq]");if(cq){S.cf.mapa=false;S.cf.q=cq.dataset.cq;render();window.scrollTo(0,0);return}
  const rp=e.target.closest("[data-resper]");if(rp){S.resPer=rp.dataset.resper;render();return}
  const pm=e.target.closest("[data-portalmapa]");if(pm){abrirPortal(pm.dataset.portalmapa);return}
  if(e.target.id==="c-pegar"){abrirPegar(null);return}
  const pgb=e.target.closest("[data-pegar]");if(pgb){abrirPegar(S.cf.zona,+pgb.dataset.pegar);return}
  const tr=e.target.closest("[data-tara]");if(tr){const Z=S.censo&&S.censo[S.cf.zona],b=Z&&Z.edificios[+tr.dataset.tara];if(b)imprimirTaratura([{zona:S.cf.zona,b}]);return}
  if(e.target.id==="c-tara"){const L=S.cf.lista||[];if(!L.length){toast("No hay portales que imprimir");return}
    if(L.length>40&&!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent=`Son ${L.length} portales. Pulsa otra vez`;return}
    imprimirTaratura(L);return}});
$("#btn-new").addEventListener("click",()=>abrir({encargos:"encargos",operaciones:"operaciones",captaciones:"captaciones",compradores:"compradores"}[S.view]||(esCoord()?"compradores":"contactos")));
$("#frm").addEventListener("click",e=>{const r=e.target.closest("[data-open]");if(!r)return;e.preventDefault();e.stopPropagation();const c=r.dataset.open,i=r.dataset.id;$("#dlg").close();setTimeout(()=>abrir(c,i),150)},true);
$("#view").addEventListener("click",e=>{const n=e.target.closest("[data-nuevo]");if(n){if(n.dataset.tipo)abrirNuevo(n.dataset.nuevo,avisoPre(n.dataset.tipo));else abrir(n.dataset.nuevo);return}const be=e.target.closest("[data-best]");if(be){S.bf.estado=be.dataset.best;render()}});
const URL_FORM_COMP="https://stiwhar3.github.io/crm-hogares/alta.html";
$("#view").addEventListener("click",async e=>{if(!e.target.closest("#b-form"))return;try{await navigator.clipboard.writeText(URL_FORM_COMP);toast("Enlace copiado: pégalo en WhatsApp o en el email al comprador")}catch(_){toast("Enlace: "+URL_FORM_COMP)}});
$("#view").addEventListener("change",e=>{const id=e.target.id||"";if(!id.startsWith("bf-"))return;S.bf[id.slice(3)]=e.target.value;render()});
$("#view").addEventListener("toggle",e=>{if(e.target.id==="bf-box")S.bfOpen=e.target.open;if(e.target.id==="bm-box")S.bmOpen=e.target.open},true);
$("#view").addEventListener("click",e=>{if(e.target.closest("#bf-quitar")){Object.assign(S.bf,{zona:"",pmin:"",pmax:"",hab:"",fin:""});render();return}
  if(e.target.closest("#bf-env")){abrirReparto();return}
  if(!e.target.closest("#bf-hoja"))return;const L=vCompradores.L||[];
  hojaCompradores(L,"Compradores_"+hoyISO()+".xlsx","Compradores").catch(err=>toast("No se ha podido descargar: "+(err.message||err)))});
$("#view").addEventListener("input",e=>{const id=e.target.id;if(id!=="b-q"&&id!=="e-q")return;if(id==="b-q")S.bf.q=e.target.value;else S.eq=e.target.value;clearTimeout(render.t2);render.t2=setTimeout(()=>{render();const i=$("#"+id);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)});

try{const v=localStorage.getItem("crm-view");if(v&&FORMS[v]||v==="hoy"||v==="equipo"||v==="censo"||v==="localizar"||v==="tutoriales"||v==="papelera"||v==="resumenes")S.view=v}catch(_){}
render();
(async()=>{
  const db=window.claude?await window.claude.use("db"):null; S.dbIntentado=true; if(!db) return render();
  try{const pm=await window.claude.use("permissions");if(pm){S.permDb=await pm.state("db");}}catch(_){}
  S.db=db;
  for(const col of ["contactos","encargos","operaciones","captaciones","compradores","visitas"]){
    db.collection(col).limit(1000).onSnapshot(s=>{S[col]=s.docs.map(d=>{const o={id:d.id,...d.data()};if(ETAPA_ANTIGUA[o.etapa])o.etapa=ETAPA_ANTIGUA[o.etapa];return o});if(!$("#dlg").open)render()},()=>{});
  }
  {let prev=null;db.collection("avisos").limit(1000).onSnapshot(sn=>{const L=sn.docs.map(d=>({id:d.id,...d.data()}));avisosNuevos(prev,L);prev=new Set(L.map(x=>x.id));S.avisos=L;if(!$("#dlg").open)render()},()=>{})}
  db.doc("zonas/indice").onSnapshot(s=>{if(!s.exists)return;const d=s.data(),I={};for(const [c,v] of Object.entries(d.calles||{})){const P={};for(const t of String(v).split(",")){const m=t.match(/^(\d+[A-Z]?)([A-Z])$/);if(m)P[m[1]]=(d.codigos||{})[m[2]]||""}I[c]=P}S.zidx=I},()=>{});
  db.doc("ajustes/general").onSnapshot(s=>{S.ajustes=s.exists?{...DEF_AJUSTES,...s.data()}:DEF_AJUSTES;render()},()=>{});
  render();
})();
$("#dlg").addEventListener("close",()=>render());
</script>
