const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function rangoPer(per){const h=new Date();h.setHours(0,0,0,0);let a,b;
  if(per==="semana"){a=new Date(h);a.setDate(h.getDate()-((h.getDay()+6)%7));b=new Date(a);b.setDate(a.getDate()+6)}

function pintarBuscar(){const q=($("#bq-q").value||"").trim().toLowerCase(),qn=q.replace(/\s/g,""),R=$("#bq-res");
  if(q.length<2){R.innerHTML='<p class="bq-vacio">Escribe al menos 2 letras o números. Busca en noticias, encargos, captaciones, operaciones'+(S.compradores.length?", compradores":"")+' y en el censo.</p>';return}
  const ok=(...v)=>{const t=v.filter(Boolean).join(" ").toLowerCase();return t.includes(q)||(qn.length>=3&&/^\d+$/.test(qn)&&t.replace(/\s/g,"").includes(qn))};
  const G=[["Noticias",S.contactos.filter(c=>ok(c.direccion,c.nombre,c.telefono,titTxt(c))),rowContacto],["Encargos",S.encargos.filter(e=>ok(e.direccion,e.propietario,e.telefono)),rowEncargo],
    ["Captaciones",S.captaciones.filter(k=>ok(k.direccion,k.propietario,k.telefono,titTxt(k))),rowCap],["Operaciones",S.operaciones.filter(o=>ok(o.inmueble,o.vendedor,o.comprador,o.telVendedor,o.telComprador,titTxt(o,"otrosVendedores"),titTxt(o,"otrosCompradores"))),rowOp]];

      if(ok(b.via+" "+b.num,viaLarga(b.via)+" "+b.num,v.prop,v.tel,titTxt(v)))V.push({id:u._id,b,u:v,zn})}
    G.push(["Censo",V,x=>`<button class="row" type="button" data-viv="${esc(x.id)}"><span class="t">${esc(viaLarga(x.b.via))} ${esc(x.b.num)} ${esc([x.u.planta,x.u.puerta].filter(Boolean).join(" "))}</span><span class="m">${zona(x.zn)}${x.u.prop?`<span>${esc(x.u.prop)}</span>`:""}${x.u.tel?`<span>${esc(x.u.tel)}</span>`:""}</span></button>`])}
  const H=G.filter(g=>g[1].length).map(([t,L,fn])=>`<h3>${t} <span>${L.length>40?"40+":L.length}</span></h3><div class="list">${L.slice(0,8).map(fn).join("")}</div>`).join("");
  R.innerHTML=H||'<p class="bq-vacio">No hay nada con «'+esc(q)+'».</p>';colorUnico(R)}
